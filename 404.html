<style>
  :root { --accent: #ff5a1f; --paper: #f4f2ec; --ink: #0a0f1a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--ink); color: var(--paper);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    gap: 20px; padding: 40px 24px; max-width: 760px; margin: 0 auto;
  }
  .flag {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0; font-size: clamp(64px, 18vw, 160px);
    font-weight: 600; line-height: 0.88; letter-spacing: -0.04em;
  }
  h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; color: var(--accent); }
  p { margin: 0; font-size: clamp(16px, 2.4vw, 20px); color: rgba(244,242,236,0.6); max-width: 46ch; }
  .rule { height: 1px; background: rgba(244,242,236,0.15); margin: 4px 0; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  a.btn {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
    padding: 13px 20px; border: 1px solid rgba(244,242,236,0.25); color: var(--paper);
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.btn:hover { background: var(--paper); border-color: var(--paper); color: var(--ink); }
  a.btn.primary:hover { background: #fff; border-color: #fff; color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="flag">◣ Yellow Flag · Sector 404</div>
  <h1>Off <em>track</em>.</h1>
  <div class="rule"></div>
  <p>That page isn't on this circuit — it may have been moved, renamed, or never existed. Let's get you back to the pit wall.</p>
  <div class="links">
    <a class="btn primary" href="/">▸ Back to the garage</a>
    <a class="btn" href="/#projects">Race log</a>
    <a class="btn" href="mailto:oajsaini@gmail.com">Box / box ↗</a>
  </div>
</main>
</body>
